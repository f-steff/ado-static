name: Share dev

# Manually (un)share the private development edition with an Azure DevOps organization.
#
# Rationale: the organization is a workflow input rather than a stored secret or variable, so there is
# nothing to keep a record of; the Marketplace retains the sharing list across version publishes, so
# this only needs running when an organization is added or removed.
#
# Confidentiality: this repository - and therefore every run name, step name, log line and run summary -
# is public, so the organization is treated as secret material at run time:
#   - the run name and the step names never contain it;
#   - it is registered with `::add-mask::` before it is used, so tfx's own output ("Sharing extension
#     with ...", the "Shared with" list) is redacted;
#   - the summary reports only HOW MANY organizations currently have access; the names are visible to
#     the publisher on the Marketplace publisher page, which is the only record of them.
# The `workflow_dispatch` form is populated from the default branch, and a dispatch runs the file at the
# ref you pick - so dispatch this from `develop` until the masking reaches `main` (the next release
# brings it over, or a workflow-only sync):
#   gh workflow run share-dev.yml --repo f-steff/ado-static --ref develop \
#     -f organization=<org> -f action=share
# Running it from `main` executes that branch's copy of this file, which still interpolates the
# organization into a step name and prints it - exactly what this version fixes.
on:
  workflow_dispatch:
    inputs:
      organization:
        description: "Azure DevOps organization to share with / unshare from (masked in the run output)"
        required: true
      action:
        description: "Whether to share or unshare"
        required: true
        default: share
        type: choice
        options:
          - share
          - unshare

run-name: "${{ inputs.action }} dev"

# Read-only: sharing changes nothing in the repository.
permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 in October 2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Mask the organization before anything can print it. The value travels only through the
      # environment, so the script text in the log stays literal and the runner redacts the value from
      # here on - including the output of the next step.
      - name: Treat the organization as secret
        env:
          ORGANIZATION: ${{ inputs.organization }}
        run: echo "::add-mask::$ORGANIZATION"
      # The organization is passed through ADO_SHARE_ORGS; scripts/tfx.js splits it on commas or
      # whitespace and shares/unshares the dev manifest's publisher + id.
      - name: ${{ inputs.action }} the requested organization
        env:
          TFS_PAT: ${{ secrets.MARKETPLACE_PAT }}
          ADO_SHARE_ORGS: ${{ inputs.organization }}
        run: node scripts/tfx.js ${{ inputs.action }} dev
      # Report the count only: the names must not appear in a public run summary. This step never
      # fails the run (sharing has already been decided) and it reads the list with tfx directly, so
      # the workflow depends on nothing beyond `.github/**` and `ci/shared-with.mjs` - a branch that
      # lacks even those still shares successfully and just says so.
      - name: Report how many organizations have access
        if: always()
        continue-on-error: true
        env:
          TFS_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          {
            echo "## Static (Dev) access"
            echo ""
            echo "Action: \`${{ inputs.action }}\` (the organization is masked in this run's output)."
            echo ""
            echo "Organizations that may install the dev edition, read back from the Marketplace:"
            echo ""
            node ci/shared-with.mjs < <(npx tfx-cli extension show --publisher f-steff --extension-id static-dev --json --token "$TFS_PAT" 2>/dev/null) 2>/dev/null \
              || echo "_Could not read the access list from the Marketplace._"
            echo ""
            echo "Names are visible to the publisher: https://marketplace.visualstudio.com/manage/publishers/f-steff"
          } >> "$GITHUB_STEP_SUMMARY"
