name: Publish stable

# Publish the public stable edition, and the dev edition at the SAME version.
#
# Rationale: both editions share one tag sequence, so a release publishes both at the same version.
# That way a tester on the dev edition is running exactly the released code on release day, and the
# numbers line up (both 0.2.0, then dev moves to 0.2.1 as `develop` advances). The tag is pushed
# BEFORE the dev publish: if that publish fails the sequence has still advanced, otherwise the next
# release would compute the same version and the Marketplace would reject it.
#
# Visibility: GitHub evaluates `run-name` when the run is created and offers no API to rename a run
# afterwards, so the computed version cannot appear in the run list. Instead this workflow writes a
# summary on the run page and a commit status naming the published version, so "what happened" is
# visible where people look.
#
# `paths-ignore`: a push whose every changed path is documentation, the CI/release scripts, tests, or
# repository housekeeping cannot change the shipped extension, so it must not mint a version.
# `overview.md` and `LICENSE` are packaged into the VSIX and are therefore NOT ignored; neither is
# `scripts/**`, because that tooling decides what goes into the package.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'ci/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/**'
      - '.gitattributes'
      - '.gitignore'
      - '.github/**'

run-name: "Publish stable (release)"

# `contents: write` pushes the version tag; `statuses: write` records the published version on the
# commit. The branch itself stays protected.
permissions:
  contents: write
  statuses: write

# Serialize with the dev publish: the two editions share one tag sequence, so publishes must not
# interleave. A queued run recomputes its version from the tags when it starts.
concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 in October 2026
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are the version source of truth
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure esbuild binary
        run: node node_modules/esbuild/install.js
      - name: Verify
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run verify:clean
      - name: Compute version
        id: version
        # --write-all sets the same version in both override manifests.
        run: node ci/version.mjs stable --write-all | tee -a "$GITHUB_OUTPUT"
      - name: Build (production)
        run: npm run build:prod
      - name: Publish stable extension
        env:
          TFS_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: npm run publish:stable
      - name: Tag the published version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Static ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"
      # The same build with the dev manifest, so the released code is testable under the dev edition
      # and both editions carry the same version until `develop` moves on.
      - name: Publish dev edition at the same version
        env:
          TFS_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: npm run publish:dev
      # Best effort: the upload is accepted and the tag is pushed, so the *asynchronous* Marketplace
      # validation must never fail the run - a status poll once flaked and left a published version
      # untagged (Q19/D29). The state goes into the summary instead.
      - name: Report the validation state
        if: always()
        env:
          TFS_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          STABLE_VALIDATION="$(node scripts/tfx.js validate stable 2>&1 || true)"
          DEV_VALIDATION="$(node scripts/tfx.js validate dev 2>&1 || true)"
          {
            echo ""
            echo "## Marketplace validation"
            echo ""
            echo "The upload is what the tag depends on; this is the asynchronous check that follows it."
            echo ""
            echo '```'
            echo "static: $STABLE_VALIDATION"
            echo "static-dev: $DEV_VALIDATION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Visible outcome: the run page gets a summary, and the commit gets a status naming the version.
      - name: Summarise what was published
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Published${VERSION:+ Static $VERSION}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Edition | \`static\` (public) |"
            echo "| Version | \`${VERSION:-not computed}\` |"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Dev edition | published at the same version |"
            echo "| Listing | https://marketplace.visualstudio.com/items?itemName=f-steff.static |"
            echo "| Publisher | https://marketplace.visualstudio.com/manage/publishers/f-steff |"
            echo ""
            echo "The Marketplace validates the upload asynchronously; if the listing page briefly errors, retry in a minute."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record the version on the commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="Marketplace: static" \
            -f description="Published Static ${{ steps.version.outputs.version }}" \
            -f target_url="https://marketplace.visualstudio.com/items?itemName=f-steff.static"
