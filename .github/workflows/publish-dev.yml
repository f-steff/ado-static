name: Publish dev

# Publish the private development edition when `develop` is merged.
# Rationale: the version is derived from git tags, then the published version is tagged. The
# `MARKETPLACE_PAT` secret holds a Marketplace (Manage) token; `DEV_SHARE_WITH` holds the
# organization name(s) the private edition is shared with (a secret so it is masked in logs).
on:
  push:
    branches:
      - develop

# Needed to push the version tag; the branch itself stays protected.
permissions:
  contents: write

# Serialize publishes so two merges cannot compute the same version.
concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are the version source of truth
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure esbuild binary
        run: node node_modules/esbuild/install.js
      - name: Verify
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run verify:clean
      - name: Compute version
        id: version
        run: node ci/version.mjs dev --write | tee -a "$GITHUB_OUTPUT"
      - name: Build (production)
        run: npm run build:prod
      - name: Publish dev extension
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
          DEV_SHARE_WITH: ${{ secrets.DEV_SHARE_WITH }}
        run: |
          npx tfx-cli extension publish \
            --publisher f-steff \
            --manifests ado-manifests/azure-devops-extension-base.json \
            --overrides-file ado-manifests/azure-devops-extension-dev.json \
            --share-with "$DEV_SHARE_WITH" \
            --token "$MARKETPLACE_PAT"
      - name: Tag the published version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Static ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"
