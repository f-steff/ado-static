name: Publish dev

# Publish the private development edition.
#
# Rationale: the version is derived from git tags, then the published version is tagged. Both editions
# share one tag sequence, so a `develop` merge publishes the next revision of the *released* minor
# (0.1.0 -> 0.1.1 -> 0.1.2): a dev version reads as "the current release plus N merges", and a release
# (`publish-stable`) publishes both editions at the same version. Publishing authenticates with the
# `marketplace` environment's Microsoft Entra identity through GitHub OIDC (no stored secret); sharing
# with tester organizations is a separate, explicit step (`share-dev.yml`).
#
# Visibility: GitHub evaluates `run-name` when the run is created and offers no API to rename a run
# afterwards, so the computed version cannot appear in the run list. Instead this workflow writes a
# summary on the run page and a commit status naming the published version.
#
# `paths-ignore`: a push whose every changed path is documentation, the CI/release scripts, tests, or
# repository housekeeping cannot change the shipped extension, so it must not mint a version.
# `overview.md` and `LICENSE` are packaged into the VSIX and are therefore NOT ignored; neither is
# `scripts/**`, because that tooling decides what goes into the package.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - 'ci/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tests/**'
      - '.gitattributes'
      - '.gitignore'
      - '.github/**'
  # Manual run: publishes the computed next version, or `version` when given. Used to re-publish after
  # a failed publish, or to align the dev edition with a release that predates the dual publish.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as static-dev (leave empty for the computed next version)"
        required: false

run-name: "Publish dev${{ inputs.version && format(' {0}', inputs.version) || '' }}"

# `contents: write` pushes the version tag; `statuses: write` records the published version on the
# commit. The branch itself stays protected.
permissions:
  contents: write
  statuses: write
  id-token: write # request the GitHub OIDC token for the publishing identity

# Serialize with the stable publish: the two editions share one tag sequence, so publishes must not
# interleave. A queued run recomputes its version from the tags when it starts.
concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 in October 2026
    environment: marketplace # matches the federated credential's subject
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are the version source of truth
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure esbuild binary
        run: node node_modules/esbuild/install.js
      - name: Verify
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run verify:clean
      - name: Compute version
        id: version
        env:
          # Passed through the environment (not interpolated into the script) and validated here.
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            case "$REQUESTED_VERSION" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "Invalid version input: $REQUESTED_VERSION"; exit 1 ;;
            esac
            echo "Publishing the requested version $REQUESTED_VERSION."
            node ci/version.mjs dev --write --version "$REQUESTED_VERSION" | tee -a "$GITHUB_OUTPUT"
          else
            node ci/version.mjs dev --write | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Build (production)
        run: npm run build:prod
      # The publishing token, best first: a Microsoft Entra access token obtained with the GitHub
      # OIDC token (no stored secret), falling back to the PAT secret while the identity is being
      # proven. 499b84ac-1321-427f-aa17-267ca6975798 is the well-known Azure DevOps / Visual Studio
      # resource id.
      - name: Sign in for the publishing token (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Acquire the publishing token
        run: |
          TOKEN="$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)"
          if [ -z "$TOKEN" ]; then
            echo "Could not obtain a Microsoft Entra token for the Marketplace (is the federated identity configured?)"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "TFS_PAT=$TOKEN" >> "$GITHUB_ENV"
          echo "Publishing with a **Microsoft Entra** token (OIDC, no secret)." >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing with a Microsoft Entra token (OIDC, no secret)."
      - name: Publish dev extension
        run: npm run publish:dev
      - name: Tag the published version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists (a release published both editions at this version); nothing to tag."
          else
            git tag -a "${{ steps.version.outputs.tag }}" -m "Static ${{ steps.version.outputs.version }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi
      # Best effort: the upload is accepted and the tag is pushed, so the *asynchronous* Marketplace
      # validation must never fail the run - a status poll once flaked and left a published version
      # untagged (Q19/D29). The state goes into the summary instead.
      - name: Report the validation state
        if: always()
        run: |
          VALIDATION="$(node scripts/tfx.js validate dev 2>&1 || true)"
          # Printed as well as collected: the run summary is not part of a run's log, so echoing it
          # here is what makes the reported state checkable from outside.
          echo "$VALIDATION"
          {
            echo ""
            echo "## Marketplace validation"
            echo ""
            echo "The upload is what the tag depends on; this is the asynchronous check that follows it."
            echo ""
            echo '```'
            echo "$VALIDATION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Visible outcome: the run page gets a summary naming the version, and so does the commit.
      - name: Summarise what was published
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Published${VERSION:+ Static (Dev) $VERSION}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Edition | \`static-dev\` (private) |"
            echo "| Version | \`${VERSION:-not computed}\` |"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Listing | https://marketplace.visualstudio.com/items?itemName=f-steff.static-dev |"
            echo "| Access | run the **Share dev** workflow, or see https://marketplace.visualstudio.com/manage/publishers/f-steff |"
            echo ""
            echo "A dev version reads as \"the current release plus N merges\" (a release publishes both editions at the same version)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record the version on the commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="Marketplace: static-dev" \
            -f description="Published Static (Dev) ${{ steps.version.outputs.version }}" \
            -f target_url="https://marketplace.visualstudio.com/items?itemName=f-steff.static-dev"
