name: Marketplace identity

# TEMPORARY helper: shows who the publishing identity is. Two things matter for adding it to the
# publisher's Members page:
#
#   1. its Entra object id (read from the token's `oid` claim - no directory permission needed), and
#   2. whether it already has a Visual Studio profile (the profile API answers VSS011031 until one
#      exists, which is also why the Members page cannot find the identity by name).
#
# The trigger is a push to this file rather than workflow_dispatch: a dispatchable workflow must exist
# on the *default* branch (main), which this repository only ever reaches through a release.
on:
  push:
    paths:
      - .github/workflows/marketplace-identity.yml

permissions:
  id-token: write # request the GitHub OIDC token that Entra exchanges for an access token
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 in October 2026
    # Must match the federated credential's subject: repo:f-steff@7275320/ado-static@1415789222:environment:marketplace
    environment: marketplace
    steps:
      - name: Sign in as the publishing identity (OIDC, no secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # The token stays in a file: passing it as an argument would put it in the step's command line.
      - name: Show the identity's Entra object id
        run: |
          az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv > token.txt
          node -e "const fs=require('fs');const t=fs.readFileSync('token.txt','utf8').trim();const p=JSON.parse(Buffer.from(t.split('.')[1],'base64url').toString());console.log('oid (Entra object id): ' + p.oid);console.log('appid (client id):     ' + p.appid);console.log('tid (tenant):          ' + p.tid);" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ask the Visual Studio profile API (informational)
        continue-on-error: true
        run: |
          az rest --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=5.1" --resource 499b84ac-1321-427f-aa17-267ca6975798 -o json > profile.json || echo "No Visual Studio profile for this identity yet (VSS011031)."
          cat profile.json
          node -e "const fs=require('fs');const t=fs.readFileSync('profile.json','utf8').trim();if(t){try{const p=JSON.parse(t);console.log('marketplace identity id: ' + p.id);}catch(e){console.log('profile API did not return JSON.');}}else{console.log('no profile.json content');}"
